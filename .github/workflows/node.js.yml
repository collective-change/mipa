name: Node.js CI

on:
  push:
    branches: [master, modernize-2026]
  pull_request:
    branches: [master, modernize-2026]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: src-pwa
      # test/unit imports functions/src/** (aiModelConsistency, stakeholderViewers),
      # which needs functions/node_modules; the app job used to never install them.
      - run: npm ci
        working-directory: functions
      - run: npm run lint
      # firebase-tools needs Java 21 for the Firestore emulator that
      # test/unit/stakeholderViewerRules.spec.js (MIPA-15) talks to on port 5002.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Unit tests (with Auth + Firestore emulators)
        run: npx --yes firebase-tools@15.36.0 emulators:exec --only auth,firestore --project demo-mipa "npm test"
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E Visual Funnel Harness
        run: npm run test:e2e
      - run: npm run build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
