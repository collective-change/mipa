<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width"
    />

    <!-- Open Graph / Social Card -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="<%= productName %>" />
    <meta property="og:description" content="<%= productDescription %>" />
    <meta property="og:image" content="/longecho/mipa-mark-icon-1024.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= productName %>" />
    <meta name="twitter:description" content="<%= productDescription %>" />
    <meta name="twitter:image" content="/longecho/mipa-mark-icon-1024.png" />

    <!-- Favicon (Symbol) -->
    <link rel="icon" type="image/svg+xml" href="/longecho/mipa-mark-icon.svg" />
    <link rel="icon" type="image/png" sizes="1024x1024" href="/longecho/mipa-mark-icon-1024.png" />

    <!-- PWA / Legacy Icons -->
    <link rel="icon" type="image/png" href="/icons/icon-128x128.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="/icons/icon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="/icons/favicon-256x256.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="384x384"
      href="/icons/favicon-384x384.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icons/favicon-512x512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/icons/apple-icon-152x152.png"
    />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
